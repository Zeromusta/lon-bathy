<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bathroom plan — 1800 × 2700 + shower recess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sheet:#ECEEEB;
  --sheet-2:#E3E6E2;
  --grid:#D5DAD5;
  --grid-hi:#C3CAC3;
  --ink:#23282C;
  --ink-soft:#5C666D;
  --shell:#B8443A;
  --fixture:#2E7A56;
  --chrome:#191D21;
  --chrome-2:#22282D;
  --chrome-3:#2E353B;
  --chrome-line:#39424A;
  --on-chrome:#DCE2E6;
  --on-chrome-dim:#8794A0;
  --select:#2F80D2;
  --clash:#F0603A;
  --glass:#5AA6C4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Barlow Semi Condensed",system-ui,sans-serif;
  font-size:15px;
  color:var(--on-chrome);
  background:var(--chrome);
  overflow:hidden;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* ---------- frame ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{
  display:flex;align-items:center;gap:12px;
  padding:0 14px;height:52px;flex:0 0 52px;
  background:var(--chrome-2);
  border-bottom:1px solid var(--chrome-line);
}
header h1{
  margin:0;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
header h1 span{color:var(--on-chrome-dim);font-weight:400;letter-spacing:.02em;text-transform:none;margin-left:10px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--chrome-line);border-radius:5px;overflow:hidden}
.seg button{
  background:transparent;border:0;color:var(--on-chrome-dim);
  padding:6px 14px;letter-spacing:.05em;text-transform:uppercase;font-size:13px;
}
.seg button+button{border-left:1px solid var(--chrome-line)}
.seg button[aria-pressed="true"]{background:var(--chrome-3);color:#fff}
.ghost{
  background:transparent;border:1px solid var(--chrome-line);border-radius:5px;
  padding:6px 12px;color:var(--on-chrome-dim);font-size:13px;letter-spacing:.04em;text-transform:uppercase;
}
.ghost:hover{color:#fff;border-color:#55616b}
.ghost.icon{padding:5px 10px;font-size:16px;line-height:1.1;letter-spacing:0;flex:none}
#scrim{display:none}

#main{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}

/* ---------- sidebar ---------- */
aside{
  width:288px;flex:0 0 288px;background:var(--chrome-2);
  border-right:1px solid var(--chrome-line);
  display:flex;flex-direction:column;min-height:0;
}
#app:not(.nav-open) aside{width:0;flex-basis:0;border-right-width:0;overflow:hidden}
.panel-tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--chrome-line)}
.panel-tabs button{
  flex:1;background:transparent;border:0;padding:11px 0;
  color:var(--on-chrome-dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:2px solid transparent;
}
.panel-tabs button[aria-pressed="true"]{color:#fff;border-bottom-color:var(--select)}
.panel-body{flex:1;overflow-y:auto;padding:14px 14px 40px}
.panel-body::-webkit-scrollbar{width:9px}
.panel-body::-webkit-scrollbar-thumb{background:var(--chrome-3);border-radius:5px}

h2.grp{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--on-chrome-dim);
  margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--chrome-line);font-weight:500;
}
h2.grp:first-child{margin-top:2px}

.row{
  display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  padding:7px 8px;border-radius:5px;
}
.row:hover{background:var(--chrome-3)}
.row .nm{font-size:14px;line-height:1.15}
.row .dims{display:flex;gap:3px;align-items:center;margin-top:4px}
.row input[type=number]{
  width:46px;background:var(--chrome);border:1px solid var(--chrome-line);border-radius:3px;
  padding:2px 4px;font-family:"Roboto Mono",monospace;font-size:11px;color:var(--on-chrome);
}
.row input[type=number]:focus{outline:1px solid var(--select);border-color:var(--select)}
.row .x{color:var(--on-chrome-dim);font-size:11px;font-family:"Roboto Mono",monospace}
.add{
  background:var(--chrome-3);border:1px solid var(--chrome-line);border-radius:4px;
  width:30px;height:30px;font-size:17px;line-height:1;color:var(--on-chrome);
}
.add:hover{background:var(--select);border-color:var(--select);color:#fff}
.swatch{width:3px;border-radius:2px;align-self:stretch;margin-right:2px}

/* inspector */
.empty{color:var(--on-chrome-dim);font-size:14px;line-height:1.5;padding:8px 2px}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0}
.field label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--on-chrome-dim)}
.field input[type=number]{
  width:78px;background:var(--chrome);border:1px solid var(--chrome-line);border-radius:4px;
  padding:5px 7px;font-family:"Roboto Mono",monospace;font-size:13px;text-align:right;
}
.field input[type=checkbox]{
  width:17px;height:17px;margin:0 30px 0 0;accent-color:var(--select);cursor:pointer;
}
.btnrow{display:flex;gap:5px;margin:10px 0}
.btnrow button{
  flex:1;background:var(--chrome-3);border:1px solid var(--chrome-line);border-radius:4px;
  padding:7px 0;font-size:13px;font-family:"Roboto Mono",monospace;
}
.btnrow button:hover{background:var(--chrome-line)}
.danger{color:#F09A8C}
.danger:hover{background:#5A2A22!important;border-color:#7A3A2E!important}

.clr{margin-top:6px;border-top:1px solid var(--chrome-line);padding-top:10px}
.clr .cl{
  display:flex;justify-content:space-between;padding:4px 0;
  font-family:"Roboto Mono",monospace;font-size:12px;
}
.clr .cl span:first-child{color:var(--on-chrome-dim);font-family:"Barlow Semi Condensed",sans-serif;font-size:13px}
.saverow{display:flex;gap:5px;margin:8px 0 6px}
.saverow input{
  flex:1;min-width:0;background:var(--chrome);border:1px solid var(--chrome-line);border-radius:4px;
  padding:6px 8px;font-size:14px;color:var(--on-chrome);
}
.saverow input:focus{outline:1px solid var(--select);border-color:var(--select)}
.savebtn{
  background:var(--select);border:1px solid var(--select);border-radius:4px;color:#fff;
  padding:6px 14px;font-size:13px;letter-spacing:.04em;
}
.savebtn:hover{filter:brightness(1.12)}
.savestate{font-size:12px;color:var(--on-chrome-dim);letter-spacing:.04em;margin-bottom:4px}
.savestate.dirty{color:#E8B77A}
.fmsg{
  font-size:13px;line-height:1.45;color:#A8D8BC;background:#1E3529;border:1px solid #2F5540;
  border-radius:4px;padding:7px 9px;margin:8px 0;
}
.fmsg.err{color:#F0B4A6;background:#3A211A;border-color:#5E3226}
.frow{border:1px solid var(--chrome-line);border-radius:5px;padding:8px 9px;margin-bottom:7px}
.frow.cur{border-color:var(--select)}
.fname{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--on-chrome)}
.fname .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font-size:11px;color:var(--on-chrome-dim);font-family:"Roboto Mono",monospace;margin:2px 0 6px}
.fbtns{display:flex;gap:4px}
.fbtns button{
  flex:1;background:var(--chrome-3);border:1px solid var(--chrome-line);border-radius:3px;
  padding:4px 0;font-size:11px;letter-spacing:.02em;
}
.fbtns button:hover{background:var(--chrome-line)}
.fbtns button.danger{color:#F09A8C}
.fbtns button.danger:hover{background:#5A2A22;border-color:#7A3A2E}
.linkbox{
  width:100%;background:var(--chrome);border:1px solid var(--select);
  border-radius:4px;color:var(--on-chrome);font-family:"Roboto Mono",monospace;font-size:11px;
  padding:7px;margin:6px 0 0;
}
.savestate b{color:var(--on-chrome);font-weight:500}
.curbadge{
  flex:none;font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--select);border:1px solid var(--select);border-radius:3px;padding:1px 5px;
}
.fbtns + .fbtns{margin-top:4px}
.note{
  font-size:13px;line-height:1.5;color:var(--on-chrome-dim);
  border-left:2px solid var(--chrome-line);padding-left:10px;margin:14px 0 0;
}
.note b{color:var(--on-chrome);font-weight:500}

.no3d{
  margin:auto;max-width:430px;padding:26px;text-align:left;
  color:var(--on-chrome-dim);font-size:13px;line-height:1.6;
}
.no3d b{color:var(--on-chrome);font-weight:500}
.no3d i{color:var(--on-chrome);font-style:normal;font-family:"Roboto Mono",monospace;font-size:12px}
.no3d-err{font-family:"Roboto Mono",monospace;font-size:11px;color:#6E7A85}

/* ---------- stage ---------- */
#stage{flex:1;display:flex;min-width:0;background:var(--chrome)}
.pane{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid var(--chrome-line)}
.pane.hidden{display:none}
.pane-hd{
  position:absolute;top:10px;left:12px;z-index:3;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  pointer-events:none;
}
#pane3d .pane-hd{color:var(--on-chrome-dim)}
.chips{position:absolute;top:8px;right:12px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  background:rgba(255,255,255,.72);border:1px solid var(--grid-hi);border-radius:4px;
  padding:3px 9px;font-family:"Roboto Mono",monospace;font-size:11px;color:var(--ink);
  backdrop-filter:blur(3px);
}
.chip b{font-weight:500}
.chip.bad{background:#FBE3DC;border-color:var(--clash);color:#8C2E1A}
.chip.good{background:#DFEDE4;border-color:#8FBBA2;color:#1E5A3C}

#plan{flex:1;background:var(--sheet);touch-action:none;display:block;width:100%;height:100%}
#c3d{flex:1;display:block;width:100%;height:100%;touch-action:none}
.itembar{
  position:absolute;bottom:8px;right:12px;z-index:4;
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.94);border:1px solid var(--grid-hi);border-radius:6px;
  padding:5px 6px 5px 11px;box-shadow:0 2px 10px rgba(0,0,0,.10);
}
.itembar[hidden]{display:none}
.itembar .ib-name{
  color:var(--ink);font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;margin-right:4px;
}
.itembar button{
  background:#fff;border:1px solid var(--grid-hi);border-radius:4px;color:var(--ink);
  padding:4px 10px;font-size:13px;
}
.itembar button:hover{background:#E6EAEE;border-color:#9AA6AE}
.itembar button.ib-danger{color:#A8331C;border-color:#E3BDB3}
.itembar button.ib-danger:hover{background:#F0603A;border-color:#F0603A;color:#fff}
.hint{
  position:absolute;bottom:9px;left:12px;z-index:3;font-size:12px;color:var(--ink-soft);
  letter-spacing:.02em;pointer-events:none;
}
#pane3d .hint{color:var(--on-chrome-dim)}

/* ---------- svg drawing conventions ---------- */
.wall{fill:var(--shell);stroke:none}
.floorfill{fill:#fff;fill-opacity:.55}
.dimline{stroke:var(--shell);stroke-width:5;fill:none}
.dimtick{stroke:var(--shell);stroke-width:5}
.dimtxt{fill:var(--shell);font-family:"Roboto Mono",monospace;font-size:86px;letter-spacing:-.02em}
.gridline{stroke:var(--grid);stroke-width:3}
.gridline.hi{stroke:var(--grid-hi);stroke-width:6}
.item rect.body{fill:#fff;fill-opacity:.88;stroke:var(--fixture);stroke-width:8}
.item .glyph{stroke:var(--fixture);stroke-width:7;fill:none}
.item .glyph.f{fill:var(--fixture);fill-opacity:.14;stroke:var(--fixture)}
.item text.lbl{
  fill:var(--fixture);font-family:"Barlow Semi Condensed",sans-serif;font-size:72px;
  text-anchor:middle;dominant-baseline:middle;letter-spacing:.02em;
  paint-order:stroke;stroke:#fff;stroke-width:16;stroke-linejoin:round;
}
.item{cursor:grab}
.item.dragging{cursor:grabbing}
.item.sel rect.body{stroke:var(--select);stroke-width:12}
.item.sel text.lbl{fill:var(--select)}
.item.sel .glyph{stroke:var(--select)}
.item.sel .glyph.f{fill:var(--select);stroke:var(--select)}
.item.clash rect.body{stroke:var(--clash);stroke-width:12;fill:url(#hatch)}
.item.clash text.lbl{fill:var(--clash)}
.item.clash .glyph{stroke:var(--clash)}
.item.wallmt rect.body{stroke-dasharray:34 20;fill-opacity:.45}
.item.wallmt .glyph.f{fill-opacity:.07}
.mline{stroke:var(--select);stroke-width:6;stroke-dasharray:22 16}
.mtick{stroke:var(--select);stroke-width:6}
.mtxt{
  fill:#fff;font-family:"Roboto Mono",monospace;font-size:70px;
  text-anchor:middle;dominant-baseline:middle;
}
.mbg{fill:var(--select);rx:6}
.selbox{fill:none;stroke:var(--select);stroke-width:5;stroke-dasharray:18 14;opacity:.6}
.doorleaf{fill:var(--shell);fill-opacity:.28;stroke:var(--shell);stroke-width:5}
.doorarrow{stroke:var(--shell);stroke-width:5;fill:none}

@media (max-width:900px){
  aside{width:264px;flex-basis:264px}
  #stage{flex-direction:column}
  .pane+.pane{border-left:0;border-top:1px solid var(--chrome-line)}
}

@media (max-width:700px){
  header{gap:8px;padding:0 10px;height:48px;flex-basis:48px}
  header h1{font-size:14px}
  header h1 span{display:none}       /* the room size is dimensioned on the plan itself */
  .seg button{padding:6px 11px;font-size:12px}
  .seg button[data-view="split"]{display:none}
  .ghost{padding:6px 10px;font-size:12px}

  /* the sidebar stops taking two thirds of the screen and slides over instead */
  aside{
    position:absolute;top:0;bottom:0;left:0;z-index:30;
    width:min(320px,86vw);flex-basis:auto;
    box-shadow:2px 0 22px rgba(0,0,0,.5);
  }
  #app:not(.nav-open) aside{display:none}
  #app.nav-open #scrim{
    display:block;position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.5);
  }

  .hint{display:none}                /* talks about right-drag and arrow keys */
  .pane-hd{display:none}             /* a label, and it collided with the chips */
  .chips{top:6px;left:8px;right:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .chip{font-size:10px;padding:2px 7px;flex:none}
  .itembar{left:8px;right:8px;bottom:8px;flex-wrap:wrap;justify-content:flex-end}
  .itembar button{padding:7px 12px;font-size:13px}
  .itembar .ib-name{max-width:100%;flex:1 0 100%;margin:0 0 3px}
  .panel-body{padding:12px 12px 52px}
  .add{width:34px;height:34px}
  .fbtns button{padding:7px 0;font-size:12px}
  /* iOS zooms the whole page when you focus an input under 16px */
  .saverow input,.field input[type=number]{font-size:16px}
  .row input[type=number]{width:58px;font-size:16px;padding:3px 5px}
  .row .nm{font-size:15px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ghost icon" id="btn-nav" aria-label="Show or hide the panels" aria-expanded="true">☰</button>
    <h1>Bathroom plan <span>1800 × 2700 · shower recess 1800 × 800</span></h1>
    <div class="spacer"></div>
    <div class="seg" id="viewseg">
      <button data-view="plan" aria-pressed="false">Plan</button>
      <button data-view="split" aria-pressed="true">Split</button>
      <button data-view="3d" aria-pressed="false">3D</button>
    </div>
    <button class="ghost" id="btn-reset" title="Back to the starting layout">Reset</button>
  </header>

  <div id="main">
    <div id="scrim"></div>
    <aside>
      <div class="panel-tabs">
        <button data-panel="palette" aria-pressed="true">Add</button>
        <button data-panel="inspect" aria-pressed="false">Selected</button>
        <button data-panel="files" aria-pressed="false">Files</button>
      </div>
      <div class="panel-body" id="panel-palette"></div>
      <div class="panel-body" id="panel-inspect" style="display:none"></div>
      <div class="panel-body" id="panel-files" style="display:none"></div>
    </aside>

    <div id="stage">
      <div class="pane" id="pane2d">
        <div class="pane-hd">Plan · 1:20 · mm</div>
        <div class="chips" id="chips"></div>
        <svg id="plan"></svg>
        <div class="itembar" id="itembar" hidden>
          <span class="ib-name" id="ib-name"></span>
          <button id="ib-behind" title="Select what's underneath (B)" hidden>Behind</button>
          <button id="ib-rot" title="Rotate 90° (R)">Rotate</button>
          <button id="ib-dup">Duplicate</button>
          <button id="ib-del" class="ib-danger" title="Delete (Del)">Delete</button>
        </div>
        <div class="hint">Drag to move · click to select · R rotates · B steps under · arrows nudge</div>
      </div>
      <div class="pane" id="pane3d">
        <div class="pane-hd">3D</div>
        <canvas id="c3d"></canvas>
        <div class="hint">Drag to orbit · scroll to zoom · right-drag or shift-drag to pan</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* =====================================================================
   ROOM SHELL  (all dimensions in mm, origin at the recess's outer corner)
   Main room 1800 x 2700. Shower recess 1800 x 800 across the top,
   offset 200 to the right — so a 200 nib of wall top-left and a 200
   overhang past the right-hand wall.
   ===================================================================== */
const R = {
  recess:{x1:200, y1:0,   x2:2000, y2:800},
  main:  {x1:0,   y1:800, x2:1800, y2:3500},
  ceil:2700,
  door:{x1:0, x2:800, y:3500, width:800}
};

// interior outline, clockwise
const POLY = [
  [0,800],[200,800],[200,0],[2000,0],[2000,800],[1800,800],[1800,3500],[0,3500]
];

// interior wall faces: {v:true,x,y1,y2,out} or {v:false,y,x1,x2,out}
const WALLS = [
  {v:true,  x:0,    y1:800, y2:3500, out:-1, name:"Left wall"},
  {v:true,  x:200,  y1:0,   y2:800,  out:-1, name:"Recess left wall"},
  {v:false, y:800,  x1:0,   x2:200,  out:-1, name:"Top wall"},
  {v:false, y:0,    x1:200, x2:2000, out:-1, name:"Shower end wall"},
  {v:true,  x:2000, y1:0,   y2:800,  out:1,  name:"Recess right wall"},
  {v:false, y:800,  x1:1800,x2:2000, out:1,  name:"Recess return"},
  {v:true,  x:1800, y1:800, y2:3500, out:1,  name:"Right wall"},
  {v:false, y:3500, x1:0,   x2:1800, out:1,  name:"Bottom wall"}
];

const WALL_T = 100;   // drawn wall thickness
const SNAP   = 70;    // snap distance, mm

/* Offset the outline outward by WALL_T and mitre the corners, so inside
   corners meet cleanly instead of each wall overshooting the other. */
const OUTER = (()=>{
  const N = POLY.length, lines = [];
  for(let i=0;i<N;i++){
    const [x1,y1]=POLY[i], [x2,y2]=POLY[(i+1)%N];
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
    lines.push({px:x1 + (dy/L)*WALL_T, py:y1 - (dx/L)*WALL_T, dx, dy});   // outward normal = (dy,-dx)
  }
  return POLY.map((_,i)=>{
    const a=lines[(i-1+N)%N], b=lines[i];
    const det = -a.dx*b.dy + b.dx*a.dy;
    const t   = (-(b.px-a.px)*b.dy + b.dx*(b.py-a.py)) / det;
    return [a.px + a.dx*t, a.py + a.dy*t];
  });
})();

/* one axis-aligned band per wall, spanning inner face to mitred outer corner */
const BANDS = POLY.map((p,i)=>{
  const q=POLY[(i+1)%POLY.length], a=OUTER[i], b=OUTER[(i+1)%OUTER.length];
  const xs=[p[0],q[0],a[0],b[0]], ys=[p[1],q[1],a[1],b[1]];
  return {x1:Math.min(...xs), x2:Math.max(...xs), y1:Math.min(...ys), y2:Math.max(...ys)};
});
const isDoorWall = b => b.y1===R.door.y && b.x1 < R.door.x2;

/* =====================================================================
   CATALOGUE
   w = along its own local X, d = along its own local Y, h = height
   mount = height off the floor (wall-hung things)
   ===================================================================== */
/* ==CATALOGUE-START== */
const CAT = [
 {g:"Sanitaryware", items:[
  {t:"bath",      n:"Bath",             w:1500,d:750, h:550,  glyph:"bath"},
  {t:"wc",        n:"WC (wall hung)",   w:400, d:540, h:400,  mount:400, glyph:"wc"},
  {t:"wcfloor",   n:"WC (floor)",       w:400, d:700, h:800,  glyph:"wc", mesh:"wcfloor"},
  {t:"duct",      n:"Duct / boxing",    w:1200,d:200, h:2700, glyph:"solid"},
  {t:"vanity",    n:"Vanity, 1 basin",  w:1200,d:450, h:850,  glyph:"vanity"},

/* =====================================================================
   DEFAULT LAYOUT — my reading of the sketch
   ===================================================================== */
function startingLayout(){
  return [
    mk("glass", 1400, 800,   0,  "Shower glass"),
    mk("head",  1875, 400,   0,  "Shower head"),
    mk("gully", 1400, 120,   0,  "Linear drain"),
    mk("vanity", 225, 1800, 270, "Vanity"),
    mk("mircab",  75, 1800, 270, "Mirror cabinet"),
    mk("wcfloor", 1450, 1200, 90, "WC"),
    mk("bath",  1425, 2750, 90,  "Bath"),
    mk("rail",    55, 2900, 90,  "Towel rail"),
    mk("planttall", 1600, 1750, 0, "Pot plant, tall")
  ];
}
let uid = 1;
function mk(t, cx, cy, rot, name){
  const d = DEF[t];
  return {id:uid++, t, n:name||d.n, x:cx, y:cy, w:d.w, d:d.d, h:d.h, rot:rot||0, mount:d.mount||0, noclash:0};
}

let items = startingLayout();
let sel = null;

/* =====================================================================
   GEOMETRY HELPERS
   ===================================================================== */
const rad = deg => deg*Math.PI/180;

function corners(it){
  const c = Math.cos(rad(it.rot)), s = Math.sin(rad(it.rot));
  const hw = it.w/2, hd = it.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([px,py])=>[
    it.x + px*c - py*s,
    it.y + px*s + py*c
  ]);
}
function aabb(it){
  const c = corners(it);
  return {
    x1:Math.min(...c.map(p=>p[0])), x2:Math.max(...c.map(p=>p[0])),
    y1:Math.min(...c.map(p=>p[1])), y2:Math.max(...c.map(p=>p[1]))
  };
}
const ov = (a1,a2,b1,b2)=>Math.min(a2,b2)-Math.max(a1,b1) > 1;

function inPoly(px,py){
  let ins=false;
  for(let i=0,j=POLY.length-1;i<POLY.length;j=i++){
    const [xi,yi]=POLY[i],[xj,yj]=POLY[j];
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}
function outsideRoom(it){
  return corners(it).some(([x,y])=>{
    const dx = it.x-x, dy = it.y-y, L = Math.hypot(dx,dy)||1;
    return !inPoly(x + dx/L*2, y + dy/L*2);
  });
}

/* separating-axis test for two rotated rectangles */
function overlaps(a,b){
  const A=corners(a), B=corners(b);
  for(const poly of [A,B]){
    for(let i=0;i<4;i++){
      const [x1,y1]=poly[i],[x2,y2]=poly[(i+1)%4];
      const nx=-(y2-y1), ny=(x2-x1);
      const len=Math.hypot(nx,ny)||1;
      const ax=nx/len, ay=ny/len;
      let aMin=Infinity,aMax=-Infinity,bMin=Infinity,bMax=-Infinity;
      for(const [x,y] of A){const p=x*ax+y*ay;aMin=Math.min(aMin,p);aMax=Math.max(aMax,p);}
      for(const [x,y] of B){const p=x*ax+y*ay;bMin=Math.min(bMin,p);bMax=Math.max(bMax,p);}
      if(aMax < bMin + 2 || bMax < aMin + 2) return false;
    }
  }
  return true;
}

/* recessed or in-the-floor things never clash with anything */
const PHANTOM = new Set(["mirror","niche","head","gully","gullyrnd","hook","chute"]);
const vTop = i => (i.mount||0) + i.h;
const vOv = (a,b) => Math.min(vTop(a),vTop(b)) - Math.max(a.mount||0, b.mount||0) > 5;
const inert = i => PHANTOM.has(i.t) || !!i.noclash;
function clashes(it){
  if(inert(it)) return false;
  if(outsideRoom(it)) return true;
  return items.some(o => o.id!==it.id && !inert(o) && vOv(it,o) && overlaps(it,o));
}

/* every item whose footprint covers this point, topmost first — the stack
   the Behind button walks down */
function pointInItem(it, px, py){
  const c = corners(it);
  let ins = false;
  for(let i=0,j=3;i<4;j=i++){
    const [xi,yi]=c[i], [xj,yj]=c[j];
    if((yi>py)!==(yj>py) && px < (xj-xi)*(py-yi)/(yj-yi)+xi) ins = !ins;
  }
  return ins;
}
const zRank = i => (i.mount||0) ? 0 : 1;      // must match renderPlan's zOrder
const itemsAt = (px,py) => items.filter(i=>pointInItem(i,px,py))
                                .sort((a,b)=>zRank(b)-zRank(a));

/* nearest blocker in each direction, from the item's bounding box */
function gaps(it){
  const A = aabb(it);
  const out = {};
  const others = items.filter(o=>o.id!==it.id && !PHANTOM.has(o.t)).map(o=>({b:aabb(o),n:o.n}));
  const dirs = [
    ["left",  (b)=>ov(b.y1,b.y2,A.y1,A.y2) && b.x2<=A.x1+2, (b)=>A.x1-b.x2, (w)=>w.v && w.x<=A.x1+2 && ov(w.y1,w.y2,A.y1,A.y2), (w)=>A.x1-w.x],
    ["right", (b)=>ov(b.y1,b.y2,A.y1,A.y2) && b.x1>=A.x2-2, (b)=>b.x1-A.x2, (w)=>w.v && w.x>=A.x2-2 && ov(w.y1,w.y2,A.y1,A.y2), (w)=>w.x-A.x2],
    ["up",    (b)=>ov(b.x1,b.x2,A.x1,A.x2) && b.y2<=A.y1+2, (b)=>A.y1-b.y2, (w)=>!w.v && w.y<=A.y1+2 && ov(w.x1,w.x2,A.x1,A.x2), (w)=>A.y1-w.y],
    ["down",  (b)=>ov(b.x1,b.x2,A.x1,A.x2) && b.y1>=A.y2-2, (b)=>b.y1-A.y2, (w)=>!w.v && w.y>=A.y2-2 && ov(w.x1,w.x2,A.x1,A.x2), (w)=>w.y-A.y2]
  ];
  for(const [key, hitB, distB, hitW, distW] of dirs){
    let best=Infinity, who="";
    for(const o of others) if(hitB(o.b)){const d=distB(o.b); if(d<best){best=d;who=o.n;}}
    for(const w of WALLS)  if(hitW(w))   {const d=distW(w);  if(d<best && d>=-2){best=d;who=w.name;}}
    out[key] = best===Infinity ? null : {d:Math.round(best), who};
  }
  return {A, ...out};
}

/* snap an item's bounding box to nearby wall faces */
function snap(it){
  const A = aabb(it);
  let dx=0, dy=0, bx=SNAP, by=SNAP;
  for(const w of WALLS){
    if(w.v){
      if(!ov(w.y1,w.y2,A.y1,A.y2)) continue;
      for(const edge of [A.x1,A.x2]){
        const diff = w.x-edge;
        if(Math.abs(diff)<bx){ bx=Math.abs(diff); dx=diff; }
      }
    }else{
      if(!ov(w.x1,w.x2,A.x1,A.x2)) continue;
      for(const edge of [A.y1,A.y2]){
        const diff = w.y-edge;
        if(Math.abs(diff)<by){ by=Math.abs(diff); dy=diff; }
      }
    }
  }
  it.x += dx; it.y += dy;
}

const PAD = 700;
const VB = {x:-PAD, y:-PAD, w:2000+PAD*2, h:3500+PAD*2};
const svg = document.getElementById("plan");
svg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

function bandRect(b){
  const x = isDoorWall(b) ? R.door.x2 : b.x1;      // leave the sliding-door opening clear
  return `<rect class="wall" x="${x}" y="${b.y1}" width="${b.x2-x}" height="${b.y2-b.y1}"/>`;
}

function gridSvg(){
  let s="";
  for(let x=0;x<=2000;x+=100) s+=`<line class="gridline${x%500?"":" hi"}" x1="${x}" y1="0" x2="${x}" y2="3500"/>`;
  for(let y=0;y<=3500;y+=100) s+=`<line class="gridline${y%500?"":" hi"}" x1="0" y1="${y}" x2="2000" y2="${y}"/>`;
  return `<g clip-path="url(#room)">${s}</g>`;
}

function dim(x1,y1,x2,y2,txt,off){
  const vert = x1===x2;
  const ox = vert?off:0, oy = vert?0:off;
  const mx = (x1+x2)/2+ox, my=(y1+y2)/2+oy;
  const rot = vert ? `transform="rotate(-90 ${mx} ${my})"` : "";
  return `
   <line class="dimline" x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}"/>
   <line class="dimtick" x1="${x1+ox-(vert?28:0)}" y1="${y1+oy-(vert?0:28)}" x2="${x1+ox+(vert?28:0)}" y2="${y1+oy+(vert?0:28)}"/>
   <line class="dimtick" x1="${x2+ox-(vert?28:0)}" y1="${y2+oy-(vert?0:28)}" x2="${x2+ox+(vert?28:0)}" y2="${y2+oy+(vert?0:28)}"/>
   <text class="dimtxt" x="${mx}" y="${my-24}" text-anchor="middle" ${rot}>${txt}</text>`;
}

function shellSvg(){
  const d = R.door;

  <defs>
    <clipPath id="room"><polygon points="${POLY.map(p=>p.join(",")).join(" ")}"/></clipPath>
    <pattern id="hatch" width="34" height="34" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#fff" fill-opacity=".8"/>
      <line x1="0" y1="0" x2="0" y2="34" stroke="var(--clash)" stroke-width="8" stroke-opacity=".5"/>
    </pattern>
  </defs>
  <polygon class="floorfill" points="${POLY.map(p=>p.join(",")).join(" ")}"/>
  ${gridSvg()}
  ${BANDS.map(bandRect).join("")}
  <rect class="doorleaf" x="${d.x2-20}" y="${3500+WALL_T+14}" width="${d.width}" height="46"/>
  <path class="doorarrow" d="M ${d.x1+120} ${3500+WALL_T+90} H ${d.x1+560} M ${d.x1+470} ${3500+WALL_T+58} l 90 32 l -90 32"/>
  <text class="dimtxt" x="${(d.x1+d.x2)/2}" y="${3500+WALL_T+250}" text-anchor="middle" font-size="74">SLIDING 800</text>

  ${dim(200,0,2000,0,"1800",-150)}
  ${dim(2000,0,2000,800,"800",180)}
  ${dim(0,800,0,3500,"2700",-170)}
  ${dim(1800,800,1800,3500,"2700",470)}
  ${dim(0,3500,1800,3500,"1800",530)}
  ${dim(0,800,200,800,"200",190)}
  ${dim(1800,800,2000,800,"200",-250)}
  `;
}

const GLYPH = {
  bath:(w,d)=>`<rect class="glyph" x="${-w/2+70}" y="${-d/2+70}" width="${w-140}" height="${d-140}" rx="90"/>
               <circle class="glyph f" cx="${-w/2+190}" cy="${-d/2+90}" r="34"/>`,
  wc:(w,d)=>`<rect class="glyph f" x="${-w/2+30}" y="${-d/2}" width="${w-60}" height="150"/>
             <ellipse class="glyph" cx="0" cy="${-d/2+340}" rx="${w/2-55}" ry="185"/>`,
  vanity:(w,d)=>`<rect class="glyph" x="${-w/2+40}" y="${-d/2+40}" width="${w-80}" height="${d-80}"/>
                 <ellipse class="glyph f" cx="0" cy="20" rx="230" ry="150"/>
                 <circle class="glyph" cx="0" cy="${-d/2+95}" r="26"/>`,
  basin:(w,d)=>`<ellipse class="glyph f" cx="0" cy="20" rx="${w/2-45}" ry="${d/2-55}"/>
                <circle class="glyph" cx="0" cy="${-d/2+70}" r="26"/>`,
  glass:(w)=>`<line class="glyph" x1="${-w/2}" y1="0" x2="${w/2}" y2="0" stroke-width="36" stroke="var(--glass)"/>
              <circle class="glyph f" cx="${-w/2+30}" cy="0" r="34"/>`,
  head:(w,d)=>`<circle class="glyph f" cx="0" cy="0" r="${Math.min(w,d)/2}"/>
               <path class="glyph" d="M ${-w/2-90} -60 h -60 M ${-w/2-90} 0 h -80 M ${-w/2-90} 60 h -60"/>`,
  drain:(w,d)=>`<rect class="glyph f" x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="14"/>`,
  drainround:(w,d)=>`<circle class="glyph f" cx="0" cy="0" r="${Math.min(w,d)/2}"/>
                     <circle class="glyph" cx="0" cy="0" r="${Math.max(8,Math.min(w,d)/2-28)}"/>`,
  fshelf:(w,d)=>`<rect class="glyph f" x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="10"/>
                 <line class="glyph" x1="${-w/2}" y1="${d/2-36}" x2="${w/2}" y2="${d/2-36}"/>`,
  frame:(w,d)=>`<rect class="glyph" x="${-w/2}" y="${-d/2}" width="${w}" height="${d}"/>
                <rect class="glyph" x="${-w/2+42}" y="${-d/2+42}" width="${Math.max(16,w-84)}" height="${Math.max(16,d-84)}"/>`,
  mirror:(w,d)=>`<rect class="glyph f" x="${-w/2}" y="${-d/2}" width="${w}" height="${Math.max(d,34)}"/>`,
  shelf:(w,d)=>`<rect class="glyph" x="${-w/2}" y="${-d/2}" width="${w}" height="${d}"/>
                <line class="glyph" x1="${-w/2}" y1="${-d/2}" x2="${w/2}" y2="${d/2}"/>`,
  rail:(w,d)=>`<line class="glyph" x1="${-w/2+40}" y1="0" x2="${w/2-40}" y2="0" stroke-width="22"/>
               <line class="glyph" x1="${-w/2+40}" y1="${-d/2}" x2="${-w/2+40}" y2="${d/2}"/>
               <line class="glyph" x1="${w/2-40}" y1="${-d/2}" x2="${w/2-40}" y2="${d/2}"/>`,
  plant:(w,d)=>`<circle class="glyph f" cx="0" cy="0" r="${Math.min(w,d)/2-20}"/>
                <path class="glyph" d="M 0 ${-d/2+50} V ${d/2-50} M ${-w/2+50} 0 H ${w/2-50}"/>`,
  solid:(w,d)=>`<line class="glyph" x1="${-w/2}" y1="${-d/2}" x2="${w/2}" y2="${d/2}" stroke-opacity=".45"/>`
};

function itemSvg(it){
  const d = DEF[it.t];
  const cls = ["item"];
  if(sel===it.id) cls.push("sel");
  if(clashes(it)) cls.push("clash");
  if(it.mount) cls.push("wallmt");
  const g = (GLYPH[d.glyph]||GLYPH.solid)(it.w, it.d);
  const showLbl = it.w > it.n.length*40 && it.d > 250;
  return `<g class="${cls.join(" ")}" data-id="${it.id}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})">
    <rect class="body" x="${-it.w/2}" y="${-it.d/2}" width="${it.w}" height="${it.d}"/>
    ${g}
    ${showLbl?`<text class="lbl" transform="rotate(${-it.rot})">${it.n}</text>`:""}
  </g>`;
}

function measureSvg(){
  const it = items.find(i=>i.id===sel);
  if(!it) return "";
  const gp = gaps(it), A = gp.A;
  let s = `<rect class="selbox" x="${A.x1}" y="${A.y1}" width="${A.x2-A.x1}" height="${A.y2-A.y1}"/>`;
  const cx=(A.x1+A.x2)/2, cy=(A.y1+A.y2)/2;
  const lines = [
    ["left",  A.x1, cy, -1, 0],
    ["right", A.x2, cy,  1, 0],
    ["up",    cx, A.y1,  0,-1],
    ["down",  cx, A.y2,  0, 1]
  ];
  for(const [k,sx,sy,dx,dy] of lines){
    const g = gp[k];
    if(!g || g.d<=1) continue;
    const ex = sx+dx*g.d, ey = sy+dy*g.d;
    const mx = (sx+ex)/2, my=(sy+ey)/2;
    const label = g.d;
    const wpx = String(label).length*44+56;
    s += `<line class="mline" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}"/>
      <line class="mtick" x1="${sx-(dx?0:26)}" y1="${sy-(dy?0:26)}" x2="${sx+(dx?0:26)}" y2="${sy+(dy?0:26)}"/>
      <line class="mtick" x1="${ex-(dx?0:26)}" y1="${ey-(dy?0:26)}" x2="${ex+(dx?0:26)}" y2="${ey+(dy?0:26)}"/>
      <rect class="mbg" x="${mx-wpx/2}" y="${my-52}" width="${wpx}" height="104"/>
      <text class="mtxt" x="${mx}" y="${my+4}">${label}</text>`;
  }
  return s;
}

function renderPlan(){
  const order = items.slice().sort((a,b)=>(a.mount||0)===(b.mount||0)?0:(a.mount||0)>(b.mount||0)?1:-1);
  const zOrder = order.slice().sort((a,b)=>((b.mount||0)?1:0)-((a.mount||0)?1:0));
  svg.innerHTML = shellSvg()
    + `<g id="items">${zOrder.map(itemSvg).join("")}</g>`
    + `<g id="measures">${measureSvg()}</g>`;
}

/* ---------- chips ---------- */
function showerOpening(){
  const g = items.find(i=>i.t==="glass");
  if(!g) return null;
  const A = aabb(g);
  if(A.y1 > 1000) return null;               // panel isn't on the recess line
  return Math.round(Math.max(0, A.x1 - 200));
}
function renderChips(){
  const area = ((1800*2700)+(1800*800))/1e6;
  const op = showerOpening();
  const bad = items.filter(clashes).length;
  let s = `<div class="chip">Floor <b>${area.toFixed(2)} m²</b></div>`;
  if(op!==null) s += `<div class="chip ${op>=800?"good":"bad"}">Shower opening <b>${op}</b></div>`;
  s += bad
    ? `<div class="chip bad">${bad} clash${bad>1?"es":""}</div>`
    : `<div class="chip good">No clashes</div>`;
  document.getElementById("chips").innerHTML = s;
}

/* =====================================================================
   INTERACTION
   ===================================================================== */
let drag = null;
let pickStack = [], pickIdx = 0;
let deepPickId = null;   // what Behind last dug out, so a drag doesn't undo it

/* The stack under the last click, pruned of anything since deleted. If the
   selection moved on some other way, rebuild it from the item's centre. */
function currentStack(){
  const it = items.find(i=>i.id===sel);
  if(!it) return [];
  let st = pickStack.filter(id => items.some(i=>i.id===id));
  if(!st.includes(sel)){
    st = itemsAt(it.x, it.y).map(i=>i.id);
    if(!st.includes(sel)) st.unshift(sel);
  }
  return st;
}
function pickBehind(){
  const st = currentStack();
  if(st.length < 2) return;
  pickStack = st;
  pickIdx = (st.indexOf(sel) + 1) % st.length;
  sel = st[pickIdx];
  deepPickId = sel;
  refresh(true);
}

function svgPt(evt){
  const p = svg.createSVGPoint();
  p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

svg.addEventListener("pointerdown", e=>{
  const g = e.target.closest(".item");
  const p = svgPt(e);
  const under = itemsAt(p.x, p.y);

  // Hit-testing only ever hands back the topmost shape. Something dug out
  // with Behind is by definition not topmost, so pressing to drag it would
  // hand the selection straight back to whatever is covering it. While the
  // dug-out item is still under the cursor, it keeps the drag. Selecting
  // anything else clears deepPickId, so ordinary clicks are unaffected.
  const keep = sel !== null && sel === deepPickId && under.some(i=>i.id===sel);
  const it = keep ? items.find(i=>i.id===sel)
                  : (g ? items.find(i=>i.id === +g.dataset.id) : null);
  if(!it){ sel = null; pickStack = []; deepPickId = null; refresh(); return; }

  sel = it.id;
  if(!keep) deepPickId = null;
  setPanel("inspect");
  pickStack = under.map(i=>i.id);
  if(!pickStack.includes(it.id)) pickStack.unshift(it.id);
  pickIdx = pickStack.indexOf(it.id);
  drag = {id:it.id, ox:p.x-it.x, oy:p.y-it.y, moved:false};
  svg.style.cursor = "grabbing";
  svg.setPointerCapture(e.pointerId);
  refresh();
});

svg.addEventListener("pointermove", e=>{
  if(!drag) return;
  const it = items.find(i=>i.id===drag.id);
  const p = svgPt(e);
  it.x = Math.round(p.x-drag.ox);
  it.y = Math.round(p.y-drag.oy);
  drag.moved = true;
  liveUpdate(it);
});

svg.addEventListener("pointerup", e=>{
  if(!drag) return;
  const it = items.find(i=>i.id===drag.id);
  if(drag.moved){ snap(it); it.x=Math.round(it.x); it.y=Math.round(it.y); }
  drag = null;
  svg.style.cursor = "";
  refresh();
});
svg.addEventListener("pointercancel", ()=>{drag=null;svg.style.cursor="";refresh();});

function liveUpdate(it){
  const g = svg.querySelector(`.item[data-id="${it.id}"]`);
  if(g){
    g.setAttribute("transform",`translate(${it.x} ${it.y}) rotate(${it.rot})`);
    g.classList.toggle("clash", clashes(it));
  }
  document.getElementById("measures").innerHTML = measureSvg();
  renderChips();
  move3D(it);
  if(panel==="inspect") renderClearances();
}

document.addEventListener("keydown", e=>{
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  const it = items.find(i=>i.id===sel);
  if(!it) return;
  const step = e.shiftKey?1:10;
  const map = {ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]};
  if(map[e.key]){ it.x+=map[e.key][0]; it.y+=map[e.key][1]; refresh(); e.preventDefault(); }
  else if(e.key==="r"||e.key==="R"){ it.rot=(it.rot+(e.shiftKey?-90:90)+360)%360; refresh(); }
  else if(e.key==="b"||e.key==="B"){ pickBehind(); e.preventDefault(); }
  else if(e.key==="Delete"||e.key==="Backspace"){ delSel(); e.preventDefault(); }
  else if(e.key==="Escape"){ sel=null; refresh(); }
});

/* =====================================================================
   SAVED LAYOUTS
   localStorage where it's allowed; in-memory otherwise, so a sandboxed
   preview still runs rather than throwing on first access.
   ===================================================================== */
const STORE_KEY = "bathroomPlanner.v1";
const FORMAT = "bathroom-planner";

const store = (()=>{
  let backed = false, mem = {layouts:{}, auto:null};
  try{
    const probe = "__probe" + Math.random();
    window.localStorage.setItem(probe, "1");
    window.localStorage.removeItem(probe);
    backed = true;
  }catch(e){ backed = false; }
  return {
    get backed(){ return backed; },
    read(){
      if(!backed) return mem;
      try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {layouts:{}, auto:null}; }
      catch(e){ return {layouts:{}, auto:null}; }
    },
    write(data){
      if(!backed){ mem = data; return true; }
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; }
      catch(e){ return false; }          // quota, private mode, etc.
    }
  };
})();

let currentName = "Bathroom plan";
let currentId   = null;
let lastSavedJSON = null;
let lastSavedAt = null;
let fileMsg = null, fileMsgErr = false;

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "layout";
const itemData = () => items.map(i=>({t:i.t, n:i.n, x:Math.round(i.x), y:Math.round(i.y),
                                      w:i.w, d:i.d, h:i.h, rot:i.rot, mount:i.mount||0,
                                      noclash:i.noclash?1:0}));
const itemsJSON = () => JSON.stringify(itemData());

function snapshot(name){
  return {
    format:FORMAT, version:1,
    name: name || currentName || "Untitled",
    saved: new Date().toISOString(),
    room: {main:R.main, recess:R.recess, ceil:R.ceil, door:R.door},
    view: viewTuple(cam),
    items: itemData()
  };
}

function restore(snap){
  if(!snap || typeof snap!=="object" || !Array.isArray(snap.items))
    throw new Error("That file isn't a bathroom plan.");
  const known = snap.items.filter(i => DEF[i.t]);
  const skipped = snap.items.length - known.length;
  items = known.map(i=>({
    id:uid++, t:i.t, n:i.n || DEF[i.t].n,
    x:+i.x||0, y:+i.y||0,
    w:+i.w || DEF[i.t].w, d:+i.d || DEF[i.t].d, h:+i.h || DEF[i.t].h,
    rot:+i.rot||0, mount:+i.mount||0, noclash:i.noclash?1:0
  }));
  sel = null;
  // The camera is part of the layout, and restore() is the one validated way
  // in — a link's view goes through viewFromTuple exactly like its items go
  // through the DEF filter.
  const view = viewFromTuple(snap.view);
  if(view){ Object.assign(cam, view); invalidate(); }
  currentName = snap.name || "Untitled";
  lastSavedJSON = itemsJSON();
  lastSavedAt = "just now";
  const notes = [];
  if(skipped) notes.push(`${skipped} unknown item${skipped>1?"s":""} skipped`);
  const rm = snap.room && snap.room.main;
  if(rm && (rm.x2-rm.x1 !== R.main.x2-R.main.x1 || rm.y2-rm.y1 !== R.main.y2-R.main.y1))
    notes.push("saved for a different room size — positions kept as-is");
  return notes;
}

const layoutList = () => {
  const d = store.read();
  return Object.entries(d.layouts||{})
    .map(([id,v])=>({id, ...v}))
    .sort((a,b)=>String(b.saved).localeCompare(String(a.saved)));
};

function persist(mutate){
  const d = store.read();
  d.layouts = d.layouts || {};
  mutate(d);
  if(!store.write(d)){ fileMsg = "Couldn't write to storage — it may be full."; fileMsgErr = true; return false; }
  return true;
}

function saveCurrent(){
  const name = (document.getElementById("lay-name").value || "").trim() || "Untitled";
  currentName = name;
  const id = currentId || ("L" + Date.now().toString(36));
  if(persist(d => { d.layouts[id] = snapshot(name); })){
    currentId = id;
    lastSavedJSON = itemsJSON();
    lastSavedAt = "just now";
    fileMsg = `Saved "${name}".`; fileMsgErr = false;
    // They have decided to keep it: resume autosave, and drop the link from
    // the address bar so a reload shows this layout rather than the link's.
    if(autosaveOff){
      autosaveOff = false;
      if(location.hash) history.replaceState(null, "", shareBase());
    }
    queueAutosave();   // so a reload right after saving shows this, not the session before it
  }
  renderFiles();
}

let autoT = null;
let autosaveOff = false;    // held off while showing a layout that arrived by link
function queueAutosave(){
  clearTimeout(autoT);
  if(autosaveOff) return;
  autoT = setTimeout(()=>{ persist(d => { d.auto = snapshot(currentName); }); }, 700);
}

function fmtDate(iso){
  const dt = new Date(iso);
  if(isNaN(dt)) return "";
  return dt.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + " " +
         dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}

function downloadJSON(obj, filename){
  try{
    const blob = new Blob([JSON.stringify(obj,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    return true;
  }catch(e){ return false; }
}

/* =====================================================================
   SHARE LINKS
   The whole layout, compacted and deflated, lives in the hash fragment.
   The fragment never reaches the server and has no length limit, which
   is what lets this work on a static host with nothing behind it.
   ==SHARE-CODEC-START==
   ===================================================================== */
const SHARE_V    = 1;
const SHARE_MAX  = 8000;    // encoded payload chars we'll even look at
const SHARE_CAP  = 200000;  // inflated bytes — stops a deflate bomb
const SHARE_ITEMS = 400;    // items we'll accept out of one link

/* One positional tuple per item, with a trailing object only for the
   fields that differ from the catalogue default. Most placed fixtures are
   untouched, so that object is usually absent — which is where the bulk
   of the saving comes from, well before compression gets involved. */
function compactItems(list){
  return list.map(i=>{
    const d = DEF[i.t] || {};
    const tup = [i.t, Math.round(+i.x||0), Math.round(+i.y||0), +i.rot||0];
    const extra = {};
    if((i.n||"")      !== (d.n||""))      extra.n     = i.n;
    if((+i.w||0)      !== (+d.w||0))      extra.w     = +i.w;
    if((+i.d||0)      !== (+d.d||0))      extra.d     = +i.d;
    if((+i.h||0)      !== (+d.h||0))      extra.h     = +i.h;
    if((+i.mount||0)  !== (+d.mount||0))  extra.mount = +i.mount||0;
    if(i.noclash)                         extra.nc    = 1;
    if(Object.keys(extra).length) tup.push(extra);
    return tup;
  });
}

function expandItems(tuples){
  if(!Array.isArray(tuples)) throw new Error("That link doesn't have a layout in it.");
  if(tuples.length > SHARE_ITEMS) throw new Error("That link claims more fixtures than a bathroom could hold.");
  return tuples.map(t=>{
    if(!Array.isArray(t) || t.length < 4)
      throw new Error("That link is damaged — one of the fixtures didn't read back.");
    const [ty, x, y, rot, extra] = t;
    const d = DEF[ty] || {};
    const e = (extra && typeof extra === "object" && !Array.isArray(extra)) ? extra : {};
    return {
      t: ty,
      n: "n" in e ? String(e.n) : (d.n || String(ty)),
      x: +x||0, y: +y||0,
      w: "w" in e ? +e.w : +d.w,
      d: "d" in e ? +e.d : +d.d,
      h: "h" in e ? +e.h : +d.h,
      rot: +rot||0,
      mount: "mount" in e ? +e.mount||0 : (+d.mount||0),
      noclash: e.nc ? 1 : 0
    };
  });
}

/* The 3D camera travels with the layout. Angles go as thousandths of a
   radian and distances as whole mm, so a whole view is six small integers —
   cheap in the link, and deflate likes digits. */
const VIEW_DEF = {theta:-Math.PI/2 + 0.55, phi:0.92, r:6400, tx:1000, ty:850, tz:1750};
const wrapPi = a => { const t = (a + Math.PI) % (Math.PI*2); return (t<0 ? t+Math.PI*2 : t) - Math.PI; };

const viewTuple = c => [
  Math.round(wrapPi(+c.theta||0)*1000), Math.round((+c.phi||0)*1000),
  Math.round(+c.r||0), Math.round(+c.tx||0), Math.round(+c.ty||0), Math.round(+c.tz||0)
];

/* A view can arrive from a share link, so none of it is trusted. The limits
   are the orbit controls' own: a camera outside them renders an empty pane,
   which just reads as a broken app. */
function viewFromTuple(t){
  if(!Array.isArray(t) || t.length < 6) return null;
  const n = (v,lo,hi,dflt) => { const x = +v; return Number.isFinite(x) ? Math.min(hi,Math.max(lo,x)) : dflt; };
  return {
    theta: n(t[0]/1000, -Math.PI*2, Math.PI*2,     VIEW_DEF.theta),
    phi:   n(t[1]/1000, 0.08, Math.PI/2-0.02,      VIEW_DEF.phi),
    r:     n(t[2], 900, 20000,                     VIEW_DEF.r),
    tx:    n(t[3], -100000, 100000,                VIEW_DEF.tx),
    ty:    n(t[4], -100000, 100000,                VIEW_DEF.ty),
    tz:    n(t[5], -100000, 100000,                VIEW_DEF.tz)
  };
}

const b64u = bytes => {
  let s = "";
  for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
};
const unb64u = s => {
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(t + "=".repeat((4 - t.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
};

const canZip = () => typeof CompressionStream === "function" && typeof DecompressionStream === "function";

/* Push bytes through a (De)CompressionStream, refusing to buffer past `cap`
   so a small payload can't inflate into a large one. */
async function zipPipe(bytes, stream, cap){
  const w = stream.writable.getWriter();
  w.write(bytes).then(()=>w.close()).catch(()=>{});   // errors surface on the read side
  const rd = stream.readable.getReader();
  const parts = [];
  let n = 0;
  for(;;){
    const {done, value} = await rd.read();
    if(done) break;
    n += value.length;
    if(cap && n > cap){ rd.cancel().catch(()=>{}); throw new Error("payload expands too far"); }
    parts.push(value);
  }
  const out = new Uint8Array(n);
  let o = 0;
  for(const p of parts){ out.set(p, o); o += p.length; }
  return out;
}

/* `p1.` compressed, `p1u.` not. The prefix means a later format change is
   detectable rather than silently mis-decoded. */
async function encodeShare(name, list, opts){
  const body = [SHARE_V, String(name==null?"Untitled":name), compactItems(list)];
  if(opts && opts.view) body.push(viewTuple(opts.view));
  const json  = JSON.stringify(body);
  const bytes = new TextEncoder().encode(json);
  if(!(opts && opts.compress === false) && canZip()){
    try{ return "p1." + b64u(await zipPipe(bytes, new CompressionStream("deflate-raw"))); }
    catch(e){ /* fall through and send it uncompressed */ }
  }
  return "p1u." + b64u(bytes);
}

/* Returns a snapshot in the same shape as a saved layout, so it can go
   through restore() — a share link is untrusted input and doesn't get a
   second, laxer path into items[]. */
async function decodeShare(payload){
  const raw = String(payload==null?"":payload).replace(/^#/, "");
  if(!raw) throw new Error("That link doesn't have a layout in it.");
  if(raw.length > SHARE_MAX) throw new Error("That link is too long to be a layout — it may have been mangled in transit.");
  const m = /^p1(u?)\.([A-Za-z0-9_-]+)$/.exec(raw);
  if(!m) throw new Error("That link isn't a bathroom plan, or it was made by a newer version of the planner.");
  if(!m[1] && !canZip()) throw new Error("That link is compressed, and this browser can't unpack it.");

  let bytes;
  try{ bytes = unb64u(m[2]); }
  catch(e){ throw new Error("That link is damaged — part of it is missing."); }
  if(!m[1]){
    try{ bytes = await zipPipe(bytes, new DecompressionStream("deflate-raw"), SHARE_CAP); }
    catch(e){ throw new Error("That link is damaged — it wouldn't unpack. It may have been cut short."); }
  }
  if(bytes.length > SHARE_CAP) throw new Error("That link is bigger than any real layout.");

  let parsed;
  try{ parsed = JSON.parse(new TextDecoder().decode(bytes)); }
  catch(e){ throw new Error("That link is damaged — the layout didn't read back."); }
  if(!Array.isArray(parsed) || parsed.length < 3) throw new Error("That link doesn't have a layout in it.");

  const [v, name, tuples, view] = parsed;
  if(v !== SHARE_V) throw new Error(`That link is format ${v}; this planner reads format ${SHARE_V}.`);
  return {
    format: FORMAT, version: 1,
    name: (typeof name === "string" && name.trim()) ? name : "Shared layout",
    items: expandItems(tuples),
    view: view === undefined ? null : view   // raw; restore() is what validates it
  };
}
/* ==SHARE-CODEC-END== */

/* The link is built on demand, never live-updated as fixtures move — that
   would churn the URL and make the back button useless. */
const shareBase = () => location.href.split("#")[0];
let shareUrl = null, shareUrlFor = null;

/* =====================================================================
   SELECTION ACTIONS
   ===================================================================== */
function rotSel(deg){
  const it = items.find(i=>i.id===sel); if(!it) return;
  it.rot = (it.rot + deg + 360)%360; refresh(true);
}
function dupSel(){
  const it = items.find(i=>i.id===sel); if(!it) return;
  const c = JSON.parse(JSON.stringify(it));
  c.id = uid++; c.x += 220; c.y += 220;
  c.n = `${DEF[it.t].n} ${items.filter(i=>i.t===it.t).length+1}`;
  items.push(c); sel = c.id; refresh(true);
}
function delSel(){
  if(sel==null) return;
  items = items.filter(i=>i.id!==sel); sel = null; refresh(true);
}
function renderItemBar(){
  const bar = document.getElementById("itembar");
  const it = items.find(i=>i.id===sel);
  if(!it){ bar.hidden = true; return; }
  bar.hidden = false;
  document.getElementById("ib-name").textContent = it.n;
  const st = currentStack(), b = document.getElementById("ib-behind");
  b.hidden = st.length < 2;
  b.textContent = st.length < 2 ? "Behind" : `Behind ${st.indexOf(sel)+1}/${st.length}`;
}
document.getElementById("ib-behind").addEventListener("click", pickBehind);
document.getElementById("ib-rot").addEventListener("click", ()=>rotSel(90));
document.getElementById("ib-dup").addEventListener("click", dupSel);
document.getElementById("ib-del").addEventListener("click", delSel);

   SIDEBAR
   ===================================================================== */

function renderPalette(){

  el.innerHTML = CAT.map(g=>`
    <h2 class="grp">${g.g}</h2>

      <div class="row" data-t="${i.t}">

          </div>

      </div>`).join("")}
  `).join("");
  el.insertAdjacentHTML("beforeend", `
    <h2 class="grp">What I assumed</h2>
    <div class="note">
      <b>Wet room floor</b> — level throughout, linear drain at the shower end. No tray, no kerb.<br><br>
      <b>No window.</b> Nothing was drawn on the sketch.<br><br>
      <b>Wall-hung WC</b> needs a frame in a duct roughly 200 deep. Add one from the list above if you want to see what it costs you.<br><br>
      <b>Sizes are bare structure</b> — no allowance for tiling or boarding.

  el.querySelectorAll(".row").forEach(row=>{
    row.querySelector(".add").addEventListener("click",()=>{

      const same = items.filter(i=>i.t===t).length;
      const it = mk(t, 900, 1900, 0, same? `${n} ${same+1}` : n);
      it.w=get("w"); it.d=get("d"); it.h=get("h");
      // drop it somewhere free-ish
      let tries=0;
      while(clashes(it) && tries<60){ it.x = 300+ (tries*137)%1300; it.y = 1100 + (tries*211)%2100; tries++; }

      refresh(true);

function clearanceHtml(it){
  const g = gaps(it);
  const row = (k,lbl)=> g[k] ? `<div class="cl"><span>${lbl} — ${g[k].who}</span><span>${g[k].d}</span></div>` : "";
  return `<h2 class="grp" style="margin-top:2px">Clearances (mm)</h2>

}
function renderClearances(){

    <div class="field"><label>Rotation</label><input type="number" id="f-r" value="${it.rot}" step="15"></div>

    </div>
    <div class="field"><label>X / Y</label><span style="font-family:'Roboto Mono',monospace;font-size:13px">${Math.round(it.x)}, ${Math.round(it.y)}</span></div>
    <div class="btnrow">
      <button id="f-dup">Duplicate</button>
      <button id="f-del" class="danger">Delete</button>

    <div class="clr" id="clrbox">${clearanceHtml(it)}</div>`;
  const bind = (id,key)=> el.querySelector(id).addEventListener("input",e=>{
    const v = +e.target.value; if(e.target.value===""||isNaN(v)) return;
    it[key] = (key==="rot") ? v : (key==="mount") ? Math.max(0,v) : Math.max(10,v);
    renderPlan(); renderChips(); renderClearances(); build3DItems();
  });
  bind("#f-w","w"); bind("#f-d","d"); bind("#f-h","h"); bind("#f-m","mount"); bind("#f-r","rot");
  el.querySelector("#f-nc").addEventListener("change", e=>{
    it.noclash = e.target.checked ? 1 : 0;
    renderPlan(); renderChips(); renderClearances(); queueAutosave();
  });
  el.querySelectorAll("[data-rot]").forEach(b=>b.addEventListener("click",()=>rotSel(+b.dataset.rot)));
  el.querySelector("#f-dup").addEventListener("click", dupSel);
  el.querySelector("#f-del").addEventListener("click", delSel);

/* "Bathroom plan" saved twice gives two identically-named slots and no way
   to tell them apart, so Save as new steps the name on. */
function uniqueName(base){
  const taken = new Set(layoutList().map(l => l.name));
  if(!taken.has(base)) return base;
  let n = 2;
  while(taken.has(`${base} ${n}`)) n++;
  return `${base} ${n}`;
}

function saveAsNew(){
  const box = document.getElementById("lay-name");
  const base = ((box && box.value) || currentName || "Untitled").trim() || "Untitled";
  if(box) box.value = uniqueName(base);
  currentId = null;              // saveCurrent() mints a fresh slot when there isn't one
  saveCurrent();
}

/* One link at a time, stashed under a key so the box renders next to
   whatever it is a link to — the working layout, or one saved row. */
const curKey = () => "cur:" + itemsJSON();
const rowKey = l => "row:" + l.id + ":" + l.saved;

async function makeShareLink(name, list, view, key){
  let copied = false;
  try{
    const url = shareBase() + "#" + await encodeShare(name, list, view ? {view} : undefined);
    shareUrl = url; shareUrlFor = key;
    try{ await navigator.clipboard.writeText(url); copied = true; }
    catch(err){ copied = false; }
    fileMsg = copied
      ? `Link to "${name}" copied — ${url.length} characters.`
      : `Couldn't reach the clipboard — the link to "${name}" is below, select it and copy.`;
    fileMsgErr = false;
  }catch(err){
    shareUrl = null; shareUrlFor = null;
    fileMsg = "Couldn't build a share link — " + err.message; fileMsgErr = true;
  }
  renderFiles();
  const box = document.querySelector(".linkbox");
  if(box && !copied){ box.focus(); box.select(); }
}

function renderFiles(){
  const el = document.getElementById("panel-files");
  const list = layoutList();
  const dirty = lastSavedJSON !== null && lastSavedJSON !== itemsJSON();
  const state = lastSavedJSON === null ? (autosaveOff ? "From a link — not saved" : "Not saved yet")
              : dirty ? "Unsaved changes" : `Saved ${lastSavedAt}`;
  const bound = currentId ? list.find(l => l.id === currentId) : null;
  const linkBox = key => (shareUrl !== null && shareUrlFor === key)
    ? `<input type="text" class="linkbox" readonly spellcheck="false">` : "";

  // say plainly which saved slot is being edited, if any
  const where = bound
    ? `Editing <b>${esc(bound.name)}</b>${dirty ? " · unsaved changes" : ` · saved ${fmtDate(bound.saved)}`}`
    : `<b>${state}</b>${state === "Not saved yet" ? " · Save puts it in the list below" : ""}`;

  el.innerHTML = `
    <h2 class="grp">This layout</h2>
    <div class="saverow">
      <input type="text" id="lay-name" value="${esc(currentName)}" placeholder="Name this layout">
      <button class="savebtn" id="lay-save" title="${bound ? "Overwrite this slot" : "Save into a new slot"}">Save</button>
    </div>
    <div class="savestate ${dirty?"dirty":""}">${where}</div>
    ${bound ? `<div class="btnrow"><button id="lay-saveas">Save as new</button></div>` : ""}
    ${fileMsg ? `<div class="fmsg ${fileMsgErr?"err":""}">${esc(fileMsg)}</div>` : ""}

    <h2 class="grp">Saved layouts${list.length?` (${list.length})`:""}</h2>
    ${list.length ? list.map(l=>`
      <div class="frow${l.id===currentId?" cur":""}">
        <div class="fname"><span class="n">${esc(l.name)}</span>${
          l.id===currentId ? `<span class="curbadge">current</span>` : ""}</div>
        <div class="fmeta">${(l.items||[]).length} items · ${fmtDate(l.saved)}</div>
        <div class="fbtns">
          <button data-act="load" data-id="${l.id}">Load</button>
          <button data-act="link" data-id="${l.id}">Link</button>
          <button data-act="exp"  data-id="${l.id}">Export</button>
        </div>
        <div class="fbtns">
          <button data-act="dup"  data-id="${l.id}">Duplicate</button>
          <button data-act="del"  data-id="${l.id}" class="danger">Delete</button>
        </div>
        ${linkBox(rowKey(l))}
      </div>`).join("") : `<div class="empty">Nothing saved yet. Name this layout and hit Save.</div>`}

    <h2 class="grp">Send &amp; receive</h2>
    <div class="btnrow">
      <button id="lay-link">Copy link to this layout</button>
    </div>
    ${linkBox(curKey())}
    <div class="btnrow">
      <button id="lay-exp">Export file</button>
      <button id="lay-imp">Import file</button>
    </div>
    <input type="file" id="lay-file" accept=".json,application/json" hidden>

    <div class="note">${store.backed
      ? "A share link carries the whole layout inside the URL — nothing is uploaded, and whoever opens it sees exactly this plan. Saved layouts live in this browser only, so export a file if you want a backup that survives clearing browser data."
      : "<b>This preview can't use browser storage</b>, so saves last only until the tab closes. Share links and file export still work."}</div>`;

  el.querySelector("#lay-save").addEventListener("click", saveCurrent);
  el.querySelector("#lay-name").addEventListener("keydown", e=>{ if(e.key==="Enter") saveCurrent(); });
  const sa = el.querySelector("#lay-saveas");
  if(sa) sa.addEventListener("click", saveAsNew);

  el.querySelectorAll(".fbtns button").forEach(b=>b.addEventListener("click",()=>{
    const id = b.dataset.id, d = store.read(), rec = d.layouts[id];
    if(!rec) return;
    if(b.dataset.act==="load"){
      try{
        const notes = restore(rec);
        currentId = id;
        fileMsg = `Loaded "${rec.name}".` + (notes.length?` (${notes.join("; ")})`:"");
        fileMsgErr = false;
        refresh(true);
      }catch(err){ fileMsg = err.message; fileMsgErr = true; renderFiles(); }
    }else if(b.dataset.act==="link"){
      makeShareLink(rec.name, rec.items || [], viewFromTuple(rec.view), rowKey({id, saved:rec.saved}));
      return;                                   // makeShareLink re-renders
    }else if(b.dataset.act==="dup"){
      const copy = JSON.parse(JSON.stringify(rec));
      copy.name = `${rec.name} copy`;
      copy.saved = new Date().toISOString();
      const nid = "L" + Date.now().toString(36);
      if(persist(dd => { dd.layouts[nid] = copy; })){ fileMsg = `Duplicated as "${copy.name}".`; fileMsgErr = false; }
      renderFiles();
    }else if(b.dataset.act==="exp"){
      if(!downloadJSON(rec, `bathroom-plan-${slug(rec.name)}.json`)){
        fileMsg = "Download was blocked here — load it, then copy a share link."; fileMsgErr = true;
      }
      renderFiles();
    }else if(b.dataset.act==="del"){
      if(persist(dd => { delete dd.layouts[id]; })){
        if(currentId===id) currentId = null;
        fileMsg = `Deleted "${rec.name}".`; fileMsgErr = false;
      }
      renderFiles();
    }
  }));

  el.querySelector("#lay-exp").addEventListener("click",()=>{
    const name = (el.querySelector("#lay-name").value||"").trim() || currentName;
    if(!downloadJSON(snapshot(name), `bathroom-plan-${slug(name)}.json`)){
      fileMsg = "Download was blocked here — copy a share link instead."; fileMsgErr = true;
      renderFiles();
    }
  });

  el.querySelector("#lay-imp").addEventListener("click",()=>el.querySelector("#lay-file").click());
  el.querySelector("#lay-file").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ importText(String(rd.result), f.name); };
    rd.onerror = ()=>{ fileMsg = "Couldn't read that file."; fileMsgErr = true; renderFiles(); };
    rd.readAsText(f);
  });

  const box = el.querySelector(".linkbox");
  if(box) box.value = shareUrl;

  el.querySelector("#lay-link").addEventListener("click", ()=>{
    const name = (el.querySelector("#lay-name").value||"").trim() || currentName;
    makeShareLink(name, itemData(), cam, curKey());
  });
}

function importText(text, label){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ fileMsg = `Couldn't read ${label} — that isn't valid JSON.`; fileMsgErr = true; renderFiles(); return; }
  try{
    const notes = restore(parsed);
    const id = "L" + Date.now().toString(36);
    persist(d => { d.layouts[id] = snapshot(currentName); });
    currentId = id;
    fileMsg = `Imported "${currentName}".` + (notes.length?` (${notes.join("; ")})`:"");
    fileMsgErr = false;
    refresh(true);
  }catch(err){ fileMsg = err.message; fileMsgErr = true; renderFiles(); }
}
