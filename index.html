/* =====================================================================
   3D
   ===================================================================== */
let scene, camera, renderer, itemRoot, wallMeshes=[], meshById={};
const cam = {...VIEW_DEF};

const C3 = {
  floor:0xD9D5CE, wall:0xEFEDE8, wallOut:0xC9C4BC,
  fixture:0xF7F7F5, accent:0x2E7A56, glass:0x9CC8D8, plant:0x3F7D4A, plant2:0x569160,
  soil:0x4A3B2C, potRim:0x9C7A59,
  pot:0xB08C6A, metal:0x9AA3A8, water:0xCFE3EA, mirror:0xBFD2D8
};

/* Firefox on some driver setups refuses a context outright — usually with
   hardware acceleration off, sometimes only when MSAA is asked for. Step
   down through weaker requests on a fresh canvas each time, since a canvas
   that has already failed getContext won't hand one over on a retry. */
function makeRenderer(){
  const tries = [
    {antialias:true},
    {antialias:false},
    {antialias:false, powerPreference:"low-power"},
    {antialias:false, powerPreference:"low-power", failIfMajorPerformanceCaveat:false}
  ];
  let last = null;
  for(const opts of tries){
    const fresh = document.createElement("canvas");
    fresh.id = "c3d";
    document.getElementById("c3d").replaceWith(fresh);
    try{ return new THREE.WebGLRenderer(Object.assign({canvas:fresh}, opts)); }
    catch(err){ last = err; }
  }
  throw last || new Error("no WebGL context");
}

function no3D(html){
  const pane = document.getElementById("pane3d");
  if(pane) pane.innerHTML = `<div class="no3d">${html}</div>`;
}

function init3D(){
  renderer = makeRenderer();
  const canvas = renderer.domElement;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x191D21);
  camera = new THREE.PerspectiveCamera(45, 1, 10, 40000);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a6f74, 0.95));
  const key = new THREE.DirectionalLight(0xffffff, 0.75);
  key.position.set(3000, 6000, 2000); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.28);
  fill.position.set(-2500, 3000, -2500); scene.add(fill);

  // floor
  const shape = new THREE.Shape();
  POLY.forEach((p,i)=> i? shape.lineTo(p[0],p[1]) : shape.moveTo(p[0],p[1]));
  const fg = new THREE.ShapeGeometry(shape);
  const floor = new THREE.Mesh(fg, new THREE.MeshLambertMaterial({color:C3.floor, side:THREE.DoubleSide}));
  floor.rotation.x = Math.PI/2;
  scene.add(floor);

  // walls
  for(const b of BANDS){
    if(isDoorWall(b)){
      addWallBox(R.door.x2, b.y1, b.x2, b.y2, R.ceil);                    // solid beyond the opening
      addWallBox(b.x1, b.y1, R.door.x2, b.y2, R.ceil-2100, 2100);         // lintel over the opening
    }else{
      addWallBox(b.x1, b.y1, b.x2, b.y2, R.ceil);
    }
  }

  itemRoot = new THREE.Group();
  scene.add(itemRoot);

  attachOrbit(canvas);
  canvas.addEventListener("webglcontextlost", e=>{
    e.preventDefault(); running = false;
    no3D("The 3D view lost its WebGL context. Reload the page to bring it back — the plan is unaffected.");
  });
  window.addEventListener("resize", resize3D);
  // A backgrounded tab suspends rAF (which is the browser saving us the work)
  // and can drop the drawing buffer, so redraw once on the way back.
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) invalidate(); });
  resize3D();
  invalidate();
}

function addWallBox(x1,z1,x2,z2,h,yBase){
  const geo = new THREE.BoxGeometry(x2-x1, h, z2-z1);
  const mat = new THREE.MeshLambertMaterial({color:C3.wall});
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x1+x2)/2, (yBase||0)+h/2, (z1+z2)/2);
  m.userData.cx = (x1+x2)/2; m.userData.cz = (z1+z2)/2;
  scene.add(m); wallMeshes.push(m);
}

function boxMesh(w,h,d,color,opts){
  const mat = new THREE.MeshLambertMaterial(Object.assign({color}, opts||{}));
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
}

/* A box narrowed towards the bottom by factor k. A 4-segment cylinder is a
   square prism; rotating it 45° puts the flats on the axes, then the scale
   gives exact w x h x d bounds — so the 3D footprint still matches the 2D. */
function taperBox(w,h,d,k,color,opts){
  const geo = new THREE.CylinderGeometry(Math.SQRT1_2, Math.SQRT1_2*k, 1, 4, 1);
  geo.rotateY(Math.PI/4);
  geo.scale(w,h,d);
  return new THREE.Mesh(geo, new THREE.MeshLambertMaterial(Object.assign({color}, opts||{})));
}

function build3DItems(){
  if(!itemRoot) return;
  while(itemRoot.children.length) itemRoot.remove(itemRoot.children[0]);
  meshById = {};
  for(const it of items){
    const g = itemMesh(it);
    g.position.set(it.x, it.mount||0, it.y);
    g.rotation.y = -rad(it.rot);
    itemRoot.add(g);
    meshById[it.id] = g;
  }
  invalidate();
}
function move3D(it){
  const g = meshById[it.id];
  if(g){ g.position.set(it.x, it.mount||0, it.y); g.rotation.y = -rad(it.rot); invalidate(); }
}

function itemMesh(it){
  const g = new THREE.Group();
  const d = DEF[it.t], W=it.w, D=it.d, H=it.h;
  const put=(m,y)=>{m.position.y=y;g.add(m);return m;};

  switch(d.mesh || d.glyph){
    case "bath":{
      put(boxMesh(W,H,D,C3.fixture), H/2);
      const inner = boxMesh(Math.max(40,W-160),60,Math.max(40,D-160),C3.water);
      inner.position.set(0,H-70,0); g.add(inner);
      const tap = boxMesh(60,150,60,C3.metal);
      tap.position.set(-W/2+190, H+75, -D/2+90); g.add(tap);
      break;
    }
    case "wc":{
      // The pan fills W x D. The old body was D*0.75 deep, which at the
      // default 400 x 540 came out 400 x 405 — square from above, and
      // nothing like the 2D outline.
      const seatT = Math.max(40, H*0.12);
      const bodyH = Math.max(60, H - seatT);
      const pan = taperBox(W*0.94, bodyH, D*0.98, 0.70, C3.fixture);
      pan.position.y = bodyH/2; g.add(pan);
      const seat = boxMesh(W, seatT, D*0.98, 0xF1F1EE);
      seat.position.y = bodyH + seatT/2; g.add(seat);
      break;
    }
    case "wcfloor":{
      // close-coupled: bowl at the front, cistern against the wall (-z),
      // the whole thing inside W x D x H
      const cisD    = Math.max(120, D*0.28);
      const panD    = D - cisD;
      const seatT   = Math.max(35, H*0.055);
      const seatTop = H*0.53;
      const panH    = Math.max(80, seatTop - seatT);
      const zPan    = D/2 - panD/2;
      const zCis    = -D/2 + cisD/2;

      const ped = taperBox(W*0.58, panH, D*0.90, 0.86, C3.fixture);
      ped.position.y = panH/2; g.add(ped);
      const bowl = taperBox(W*0.92, panH*0.62, panD*0.96, 0.66, C3.fixture);
      bowl.position.set(0, panH*0.69, zPan); g.add(bowl);
      const seat = boxMesh(W, seatT, panD*0.96, 0xF1F1EE);
      seat.position.set(0, panH + seatT/2, zPan); g.add(seat);
      const cisH = Math.max(60, H - seatTop - 24);
      const cis  = boxMesh(W, cisH, cisD, C3.fixture);
      cis.position.set(0, seatTop + cisH/2, zCis); g.add(cis);
      const lid = boxMesh(W, 24, cisD, 0xF1F1EE);
      lid.position.set(0, seatTop + cisH + 12, zCis); g.add(lid);
      break;
    }
    case "fshelf":{
      put(boxMesh(W, Math.min(H,60), D, C3.fixture), Math.min(H,60)/2);
      break;
    }
    case "drainround":{
      const r = Math.min(W,D)/2;
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(r,r,20,24),
        new THREE.MeshLambertMaterial({color:C3.metal}));
      ring.position.y = 10; g.add(ring);
      const hole = new THREE.Mesh(new THREE.CylinderGeometry(r*0.6,r*0.6,26,20),
        new THREE.MeshLambertMaterial({color:0x2A2F34}));
      hole.position.y = 12; g.add(hole);
      break;
    }
    case "frame":{
      // an empty picture frame on the wall: border proud, opening recessed
      const b = Math.max(35, Math.min(W,H)*0.12);
      const openD = Math.max(10, D*0.35);
      const open = boxMesh(Math.max(20,W-b*2), Math.max(20,H-b*2), openD, 0x23282D);
      open.position.set(0, H/2, -D/2 + openD/2); g.add(open);
      const bar = (bw,bh,bx,by)=>{
        const m = boxMesh(bw,bh,D,C3.fixture); m.position.set(bx,by,0); g.add(m);
      };
      bar(W, b, 0, H-b/2);
      bar(W, b, 0, b/2);
      bar(b, Math.max(0,H-b*2), -W/2+b/2, H/2);
      bar(b, Math.max(0,H-b*2),  W/2-b/2, H/2);
      break;
    }
    case "vanity":{
      put(boxMesh(W,H,D,C3.fixture), H/2);
      const top = boxMesh(W+30,50,D+30,0xE4E2DC); top.position.y=H+20; g.add(top);
      const br = Math.max(50, Math.min(190, W/4, D/2.6));
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(br,br*0.79,110,24), new THREE.MeshLambertMaterial({color:0xFFFFFF}));
      bowl.position.set(0,H+95,10); g.add(bowl);
      break;
    }
    case "basin":{
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(W/2,W/2.6,H,24), new THREE.MeshLambertMaterial({color:0xFFFFFF}));
      put(bowl,H/2); break;
    }
    case "glass":{
      const m = boxMesh(W,H,Math.max(D,18),C3.glass,{transparent:true,opacity:0.3});
      put(m,H/2);
      const f = boxMesh(W,40,Math.max(D,18)+10,C3.metal); f.position.y=H; g.add(f);
      break;
    }
    case "head":{
      const arm = boxMesh(240,60,60,C3.metal); arm.position.set(-100,0,0); g.add(arm);
      const rose = new THREE.Mesh(new THREE.CylinderGeometry(115,115,40,20), new THREE.MeshLambertMaterial({color:C3.metal}));
      rose.position.set(-210,-45,0); g.add(rose);
      break;
    }
    case "drain":{ put(boxMesh(W,20,D,C3.metal), 10); break; }
    case "mirror":{
      put(boxMesh(W,H,Math.max(D,25),C3.mirror), H/2); break;
    }
    case "shelf":{
      const n = Math.max(2, Math.round(H/380));
      for(let i=0;i<n;i++){
        const s = boxMesh(W,26,D,C3.fixture);
        s.position.y = H*(i+1)/n - 26;
        g.add(s);
      }
      break;
    }
    case "rail":{
      const bars = Math.max(2, Math.round(H/260));
      for(let i=0;i<bars;i++){
        const b = new THREE.Mesh(new THREE.CylinderGeometry(22,22,W-60,12), new THREE.MeshLambertMaterial({color:C3.metal}));
        b.rotation.z = Math.PI/2;
        b.position.set(0, H*(i+0.5)/bars, 0);
        g.add(b);
      }
      const l1 = boxMesh(40,H,40,C3.metal); l1.position.set(-W/2+30,H/2,0); g.add(l1);
      const l2 = boxMesh(40,H,40,C3.metal); l2.position.set(W/2-30,H/2,0); g.add(l2);
      break;
    }
    case "plant":{
      const potR = Math.max(35, Math.min(W,D)/2*0.82);
      const potH = Math.min(H*0.45, Math.max(30, potR*1.7));
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(potR, potR*0.70, potH, 24),
        new THREE.MeshLambertMaterial({color:C3.pot}));
      pot.position.y = potH/2; g.add(pot);
      const rimH = Math.max(14, potH*0.13);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(potR*1.07, potR*1.03, rimH, 24),
        new THREE.MeshLambertMaterial({color:C3.potRim}));
      rim.position.y = potH - rimH/2; g.add(rim);
      const soil = new THREE.Mesh(new THREE.CylinderGeometry(potR*0.93, potR*0.93, 26, 20),
        new THREE.MeshLambertMaterial({color:C3.soil}));
      soil.position.y = potH - 13; g.add(soil);

      // foliage starts below the soil line so nothing appears to hover
      const base  = potH - Math.min(22, potH*0.25);
      const reach = Math.max(40, H - base);

      if(reach > 520){
        // tall, narrow footprint — upright blades, dracaena style
        const n = 9;
        for(let i=0;i<n;i++){
          const tilt = 0.09 + (i%3)*0.06;
          const len  = reach/Math.cos(tilt) * (0.60 + (i%3)*0.20);
          const leaf = new THREE.Mesh(
            new THREE.CylinderGeometry(Math.max(1, len*0.018), potR*0.30, len, 6),
            new THREE.MeshLambertMaterial({color: i%2 ? C3.plant : C3.plant2}));
          leaf.scale.z = 0.30;
          leaf.rotation.x = tilt;
          leaf.position.set(0, len/2*Math.cos(tilt), potR*0.26 + len/2*Math.sin(tilt));
          const pivot = new THREE.Group();
          pivot.rotation.y = (i/n)*Math.PI*2 + (i%2)*0.34;
          pivot.position.y = base;
          pivot.add(leaf); g.add(pivot);
        }
      }else{
        // low and bushy — overlapping mound built in unit space, then scaled to fit
        const bush = new THREE.Group();
        const blobs = [[0,0.45,0,0.45],[-0.48,0.30,0.18,0.36],[0.46,0.32,-0.20,0.34],
                       [0.15,0.66,0.28,0.30],[-0.20,0.63,-0.26,0.29],[0.02,0.18,0,0.42]];
        blobs.forEach(([bx,by,bz,br],i)=>{
          const s = new THREE.Mesh(new THREE.SphereGeometry(br,14,12),
            new THREE.MeshLambertMaterial({color: i%2 ? C3.plant : C3.plant2}));
          s.position.set(bx,by,bz); bush.add(s);
        });
        const rr = Math.max(30, Math.min(W,D)/2*0.98);
        bush.scale.set(rr, reach, rr);
        bush.position.y = base;
        g.add(bush);
      }
      break;
    }
    default: put(boxMesh(W,H,D,C3.fixture), H/2);
  }
  return g;
}

/* orbit controls */
function attachOrbit(canvas){
  let mode=null, lx=0, ly=0;
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("pointerdown",e=>{
    mode = (e.button===2 || e.shiftKey) ? "pan" : "orbit";
    lx=e.clientX; ly=e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!mode) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(mode==="orbit"){
      cam.theta -= dx*0.006;
      cam.phi = Math.max(0.08, Math.min(Math.PI/2-0.02, cam.phi - dy*0.005));
    }else{
      const s = cam.r*0.0011;
      cam.tx += Math.sin(cam.theta)*dx*s;
      cam.tz -= Math.cos(cam.theta)*dx*s;
      cam.ty += dy*s;
    }
    invalidate();
  });
  const stop=()=>{ if(mode){ mode=null; queueAutosave(); } };
  canvas.addEventListener("pointerup",stop);
  canvas.addEventListener("pointercancel",stop);
  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    cam.r = Math.max(900, Math.min(20000, cam.r * (1 + Math.sign(e.deltaY)*0.12)));
    invalidate();
    queueAutosave();          // debounced, so a burst of wheel events collapses
  },{passive:false});
}

function resize3D(){
  if(!renderer) return;
  const c = document.getElementById("c3d");
  const w = c.clientWidth || 1, h = c.clientHeight || 1;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  invalidate();
}

let running = true, rafId = null;

/* Nothing in this scene animates. Rendering on every rAF just burns a core
   and a GPU process redrawing an identical image, so draw only when
   something has actually changed and let the loop fall idle otherwise.
   Everything that moves the camera or the meshes calls invalidate(). */
function invalidate(){
  if(!running || !renderer || rafId !== null) return;
  rafId = requestAnimationFrame(animate);
}

function animate(){
  rafId = null;
  if(!running) return;
  const cx = cam.tx, cy = cam.ty, cz = cam.tz;
  camera.position.set(
    cx + cam.r*Math.cos(cam.phi)*Math.cos(cam.theta),
    cy + cam.r*Math.sin(cam.phi),
    cz + cam.r*Math.cos(cam.phi)*Math.sin(cam.theta)
  );
  camera.lookAt(cx, cy, cz);

  // doll's-house: hide whichever walls sit between the camera and the room
  const rc = new THREE.Vector3(1000, 0, 1750);
  for(const m of wallMeshes){
    const toWall = new THREE.Vector3(m.userData.cx - rc.x, 0, m.userData.cz - rc.z).normalize();
    const toCam  = new THREE.Vector3(camera.position.x - rc.x, 0, camera.position.z - rc.z).normalize();
    m.visible = toWall.dot(toCam) < 0.42;
  }
  try{ renderer.render(scene, camera); }
  catch(err){
    running = false;
    no3D("The 3D view stopped: " + esc(err.message) + " The plan is unaffected.");
  }
}

/* =====================================================================
   GO
   ===================================================================== */
renderPalette();
renderInspector();

function loadAutosave(){
  const auto = store.read().auto;
  if(!(auto && Array.isArray(auto.items) && auto.items.length)) return false;
  try{
    restore(auto);
    lastSavedJSON = null; lastSavedAt = null;
    return true;
  }catch(e){ items = startingLayout(); return false; }
}

// A layout in the hash wins over the autosave — but until they save it,
// autosave stays off, so opening someone else's link never quietly
// overwrites the session they had going.
function loadFromLink(payload){
  autosaveOff = true;
  return decodeShare(payload).then(snap=>{
    restore(snap);
    currentId = null;
    lastSavedJSON = null; lastSavedAt = null;
    fileMsg = `Loaded "${currentName}" from a link. Save it to keep it here — until you do, ` +
              `autosave is paused so your last session stays as you left it.`;
    fileMsgErr = false;
    refresh(true);
    setPanel("files");           // the message explains what just happened —
  }).catch(err=>{                 // don't leave it behind an unopened tab
    const had = loadAutosave();
    autosaveOff = false;
    fileMsg = err.message + (had ? " Your last session is back." : "");
    fileMsgErr = true;
    refresh(true);
    setPanel("files");
  });
}

// Pasting a link into a tab that already has the planner open changes the
// hash without reloading, so the load has to hang off hashchange as well as
// startup. Our own replaceState on save doesn't fire this.
window.addEventListener("hashchange", ()=>{
  const h = location.hash.slice(1);
  if(h) loadFromLink(h);
});

const fromLink = location.hash.slice(1);
if(fromLink){
  autosaveOff = true;                     // before refresh(), which would queue one
}else if(loadAutosave()){
  fileMsg = "Picked up your last session."; fileMsgErr = false;
}
renderFiles();
refresh();
if(fromLink) loadFromLink(fromLink);
if(!window.THREE){
  no3D("3D needs the three.js CDN — check your connection and reload.");
}else{
  try{
    init3D();
    build3DItems();
  }catch(err){
    running = false;
    no3D(`<b>This browser wouldn't give us a WebGL context</b>, so the 3D view is off.
           The 2D plan, clearances and sharing all work as normal.
           <br><br>In Firefox this is nearly always hardware acceleration being disabled:
           Settings → General → Performance, untick <i>Use recommended performance settings</i>,
           then tick <i>Use hardware acceleration when available</i> and reload.
           <br><br><span class="no3d-err">${esc(err.message)}</span>`);
  }
}

// Both of these call resize3D(), so they have to run after the 3D section has
// been evaluated — and after init3D, since hiding a pane first would mean
// asking for a WebGL context on a display:none canvas, which some browsers
// refuse. Split is two useless slivers on a phone, so open on the plan.
setNav(!isPhone());
if(isPhone()) setView("plan");
</script>
